name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cada push: tests + APK de prueba (Aura Dev), disponible como artefacto.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests + APK debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # En main: si versionName es nueva, publica un Release firmado.
  # Para sacar una versión basta con subir versionName/versionCode y fusionar a main.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Hay que publicar?
        id: check
        env:
          KEYSTORE_B64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION ya está publicada; sube versionName para sacar otra."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Faltan los secrets de firma (AURA_KEYSTORE_BASE64...). No se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.publish == 'true'

      - name: APK firmado
        if: steps.check.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: |
          export AURA_KEYSTORE_PATH="$RUNNER_TEMP/aura-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$AURA_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$AURA_KEYSTORE_PATH"
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          # Nombre fijo para el enlace "latest" del README + copia con versión.
          cp "$APK" Aura.apk
          cp "$APK" "Aura-${{ steps.check.outputs.version }}.apk"

      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: Aura ${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            Aura.apk
            Aura-${{ steps.check.outputs.version }}.apk
